<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — {{ app_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pictures/vib_logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="card shadow-lg">
            <div class="card-body p-5">

                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='pictures/vib_logo.png') }}"
                         alt="VIB Nucleomics" style="height: 80px; margin-bottom: 1rem;">
                    <h2 class="h4 mb-1">{{ app_name }}</h2>
                    <p class="text-muted small">{{ org_name }}</p>
                    <p class="text-muted">Sign in to your account</p>
                </div>

                <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username"
                               name="username" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password"
                                   name="password" required autocomplete="current-password">
                            <button class="btn btn-outline-secondary" type="button"
                                    id="toggle-password" tabindex="-1">
                                <i class="bi bi-eye" id="toggle-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="/forgot-password" class="text-muted small">Forgot password?</a>
                </div>

                <div class="text-center mt-2 text-muted small">
                    Contact <a href="mailto:{{ support_email }}">{{ support_email }}</a> for access.
                </div>

            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#toggle-password').on('click', function () {
            const input = $('#password');
            const icon  = $('#toggle-icon');
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass('bi-eye').addClass('bi-eye-slash');
            } else {
                input.attr('type', 'password');
                icon.removeClass('bi-eye-slash').addClass('bi-eye');
            }
        });

        // Honour ?next=… so a deep-link redirect to login returns the
        // user where they wanted to go after a successful sign-in.
        function _nextParam() {
            const p = new URLSearchParams(window.location.search);
            return p.get('next') || '/';
        }

        $('#login-form').on('submit', function (e) {
            e.preventDefault();
            const username = $('#username').val();
            const password = $('#password').val();

            $.ajax({
                url: '/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username, password }),
                success: function (response) {
                    if (response.must_change_password) {
                        window.location.href = '/change-password';
                    } else {
                        window.location.href = _nextParam();
                    }
                },
                error: function (xhr) {
                    const error = xhr.responseJSON?.error || 'Login failed. Please try again.';
                    $('#error-message').text(error).removeClass('d-none');
                }
            });
        });
    </script>
</body>
</html>
