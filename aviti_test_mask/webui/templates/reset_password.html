<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — {{ app_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pictures/vib_logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="card shadow-lg">
            <div class="card-body p-5">

                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='pictures/vib_logo.png') }}"
                         alt="VIB" style="height: 70px; margin-bottom: 1rem;">
                    <h2 class="h5 mb-1">{{ app_name }}</h2>
                    <p class="text-muted">Set a new password</p>
                </div>

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                    <div class="mt-2">
                        <a href="/forgot-password" class="alert-link">Request a new reset link</a>
                    </div>
                </div>
                {% else %}

                <div id="feedback" class="d-none"></div>

                <form id="reset-form">
                    <input type="hidden" id="token" value="{{ token }}">
                    <div class="mb-3">
                        <label class="form-label">New Password
                            <small class="text-muted">(min {{ password_min_length }} characters)</small>
                        </label>
                        <input type="password" class="form-control" id="new_password"
                               autocomplete="new-password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password"
                               autocomplete="new-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Set New Password</button>
                    </div>
                </form>
                {% endif %}

                <div class="text-center mt-3">
                    <a href="/login" class="text-muted small">Back to Login</a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    $('#reset-form').on('submit', function(e) {
        e.preventDefault();
        const token    = $('#token').val();
        const feedback = $('#feedback');

        $.ajax({
            url: '/reset-password/' + token,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                new_password:     $('#new_password').val(),
                confirm_password: $('#confirm_password').val()
            }),
            success: function() {
                feedback.removeClass('d-none alert-danger')
                        .addClass('alert alert-success')
                        .text('Password reset successfully. Redirecting to login…');
                setTimeout(() => window.location.href = '/login', 2000);
            },
            error: function(xhr) {
                const msg = xhr.responseJSON?.error || 'Reset failed.';
                feedback.removeClass('d-none alert-success')
                        .addClass('alert alert-danger')
                        .text(msg);
            }
        });
    });
    </script>
</body>
</html>
