<!DOCTYPE html>
<!--
  aviti_test_mask web UI — VIB Nucleomics Core.
  Author: Stephane Plaisance <stephane.plaisance@vib.be>
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pictures/vib_logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-dark bg-dark" style="overflow: visible;">
        <div class="container-fluid" style="overflow: visible;">

            <div class="d-flex align-items-center" style="gap: 10px;">
                <img src="{{ url_for('static', filename='pictures/vib_logo_white.png') }}"
                     alt="VIB" style="height: 30px;">
                <span class="navbar-brand mb-0 h1">{{ app_name }}</span>
            </div>

            <div class="d-flex align-items-center" style="overflow: visible;">
                <div class="btn-group me-2" role="group">
                    <a href="/" class="btn btn-sm btn-outline-light">🚀 Submit</a>
                    <a href="/queue" class="btn btn-sm btn-outline-light">🕒 Queue</a>
                    <a href="/history" class="btn btn-sm btn-outline-light">📜 History</a>
                    <a href="/monitor" class="btn btn-sm btn-outline-light">📊 Monitor</a>
                </div>
                <a href="/about" class="btn btn-sm btn-outline-light me-2">ℹ️ About</a>
                {% block nav_buttons %}{% endblock %}
            </div>
        </div>
    </nav>

    <main class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted small py-3 mt-4">
        © {{ org_name }} · <a href="mailto:{{ support_email }}">{{ support_email }}</a>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}

</body>
</html>
