# Web UI configuration. Loaded in addition to the script's config.yaml.
# All paths are absolute. Dev defaults point at the Mac NAS mount;
# the Ubuntu production host will override these via its own copy.
#
# Part of aviti_test_mask — VIB Nucleomics Core.
# Author: Stephane Plaisance <stephane.plaisance@vib.be>

# --- App metadata (shown in UI navbar, footer, /about, /api/v1/health) ---
app_name: aviti_test_mask
app_version: 0.1.0
release_date: 2026-05-26
org_name: VIB Nucleomics Core
support_email: nucleomics@vib.be

# --- NAS / run discovery ---
nas_root: /Volumes/lvs/GBW-0047_NUC_Transfers/0003_Runs/Aviti
sequencer_subdirs_glob: "AV*"
run_folder_marker: RunManifest.json
run_folder_regex: '^\d{8}_AV\d+_\d+_\d+$'
run_age_days: 365
deep_validate: false                       # gate optional zip magic-byte check

# --- Storage paths ---
results_root: ../../results                # Mac dev: project-local; project lives in
jobs_dir: ../../results                    # $HOME so colima auto-mounts the path.
db_path: ../../results/jobs.db             # Ubuntu prod overrides to /data/analyses/aviti_test_mask

# --- Concurrency ---
# Mac-dev defaults (M2 with colima emulating linux/amd64). The amd64
# bases2fastq image runs under QEMU translation here, ~3-5x slower than
# native, so we keep parallelism tight.
# Production (Ubuntu, native amd64) should bump these:
#   max_global_containers: 3
#   max_inner_jobs: 3
#   threads: 8
max_global_containers: 1
max_concurrent_jobs: 1
max_jobs_per_user: 1
max_inner_jobs: 1
threads: 4

# --- Server ---
host: 127.0.0.1
port: 8765

# --- Retention ---
retain_jobs_days: 30
retain_jobs_min_keep: 5
purge_on_each_request: true

# --- Backups (DB only — see HANDOFF "Feature designs → DB backup loop") ---
# MUST be a different host path than results_root, otherwise --wipe / rm -rf
# destroys both. Ubuntu prod overrides to e.g. /data/backups (on a different
# bind mount). Docker deployment will need a third bind-mount entry in
# docker-compose.yml mapping BACKUP_ROOT:/data/backups.
backup_enabled: true
backup_interval_days: 7
backup_retain_count: 8
backup_dir: ../../backups

# --- Files (paths resolved relative to this YAML's location) ---
users_file: users.yaml
masks_file: ../../scripts/masks.yaml       # reuse the bash script's mask list
scripts_dir: ../../scripts                 # where aviti_test_mask.sh lives

# Conda env the bash scripts try to activate after spawning. The worker
# exports CONDA_ENV_NAME=<this> when launching the script. Mac dev
# typically: 'aviti_test_mask_webui'. Ubuntu prod: 'pythonenv'.
conda_env_name: aviti_test_mask_webui

# --- Auth (session login + email reset; see services/auth.py + email.py)
# Session lifetime applies to Flask-Session's filesystem backend. The
# directory itself lives in /tmp (tmpfs) — see app.py. cleanup_age_hours
# governs how aggressively expired session files are pruned on login.
# cookie_secure MUST be true when serving behind HTTPS in Portainer.
session:
  lifetime_hours: 8
  cleanup_age_hours: 72
  cookie_secure: false

# SMTP wiring. Credentials (MAIL_USERNAME / MAIL_PASSWORD) come from the
# environment (.env in dev, Portainer env vars in prod) — NEVER stored
# here. Defaults target Gmail-app-password masquerade (the VIB SMTP
# gateway will not authenticate a containerised service — see
# ~/.claude/skills/webapp_template/AUTH_MODULE.md §3).
email:
  smtp_server: smtp.gmail.com
  smtp_port: 587
  use_tls: true

# Password policy. Increase for prod if VIB IT requires it.
auth:
  password_min_length: 8
